[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credsort-common"
version = "0.1.0"
description = "Technical shared library for CredSort services: outbox/inbox, tokens, RLS sessions, resilient HTTP. No domain logic (ADR-0030)."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]", "sqlalchemy>=2.0", "psycopg[binary]>=3.2",
  "pydantic>=2.7", "pyjwt[crypto]", "cryptography", "httpx", "pika", "jsonschema",
]

[project.optional-dependencies]
otel = ["opentelemetry-api", "opentelemetry-sdk", "opentelemetry-exporter-otlp-proto-http",
        "opentelemetry-instrumentation-fastapi", "opentelemetry-instrumentation-httpx"]
test = ["pytest", "pgserver"]

[tool.setuptools.packages.find]
include = ["credsort_common*"]

[tool.setuptools.package-data]
credsort_common = ["sql/*.sql"]
