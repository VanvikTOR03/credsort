# UNVERIFIED: written without a Docker runtime. Dev without Docker: scripts/dev_up.py. See docs/architecture/09-deployment.md.
name: credsort

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_PASSWORD_IDENTITY: ${DB_PASSWORD_IDENTITY}
      DB_PASSWORD_ACCOUNTING: ${DB_PASSWORD_ACCOUNTING}
      DB_PASSWORD_INTELLIGENCE: ${DB_PASSWORD_INTELLIGENCE}
      DB_PASSWORD_MARKETPLACE: ${DB_PASSWORD_MARKETPLACE}
      DB_PASSWORD_BILLING: ${DB_PASSWORD_BILLING}
      DB_PASSWORD_ADVISORY: ${DB_PASSWORD_ADVISORY}
      DB_PASSWORD_NOTIFICATION: ${DB_PASSWORD_NOTIFICATION}
      DB_PASSWORD_AUDIT: ${DB_PASSWORD_AUDIT}
      DB_PASSWORD_KEYCLOAK: ${DB_PASSWORD_KEYCLOAK}
    volumes:
      - ./../postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 20}

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: credsort
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: credsort
    healthcheck: {test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"], interval: 10s, retries: 20}

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres/credsort_keycloak
      KC_DB_USERNAME: keycloak_owner
      KC_DB_PASSWORD: ${DB_PASSWORD_KEYCLOAK}
    volumes: ["./../keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro"]
    ports: ["8080:8080"]
    depends_on: {postgres: {condition: service_healthy}}

  identity:
    build: {context: ../.., dockerfile: deploy/compose/Dockerfile.service, args: {SERVICE: identity}}
    environment:
      PORT: "8001"
      CREDSORT_ENV: ${CREDSORT_ENV:-dev}
      DATABASE_URL: postgresql+psycopg://identity_owner:${DB_PASSWORD_IDENTITY}@postgres/credsort_identity
      DATABASE_ADMIN_URL: postgresql+psycopg://identity_owner:${DB_PASSWORD_IDENTITY}@postgres/credsort_identity
      BROKER_URL: amqp://credsort:${RABBITMQ_PASSWORD}@rabbitmq/credsort
      SERVICE_AUTH_MODE: ${SERVICE_AUTH_MODE:-keycloak}
      SERVICE_CLIENT_SECRET: ${SERVICE_CLIENT_SECRET}
      IDENTITY_URL: http://identity:8001
      ACCOUNTING_URL: http://accounting:8002
      INTELLIGENCE_URL: http://intelligence:8003
      MARKETPLACE_URL: http://marketplace:8004
      BILLING_URL: http://billing:8005
      ADVISORY_URL: http://advisory:8006
      NOTIFICATION_URL: http://notification:8007
      AUDIT_URL: http://audit:8008
    depends_on: {postgres: {condition: service_healthy}, rabbitmq: {condition: service_healthy}}

  accounting:
    build: {context: ../.., dockerfile: deploy/compose/Dockerfile.service, args: {SERVICE: accounting}}
    environment:
      PORT: "8002"
      CREDSORT_ENV: ${CREDSORT_ENV:-dev}
      DATABASE_URL: postgresql+psycopg://accounting_owner:${DB_PASSWORD_ACCOUNTING}@postgres/credsort_accounting
      DATABASE_ADMIN_URL: postgresql+psycopg://accounting_owner:${DB_PASSWORD_ACCOUNTING}@postgres/credsort_accounting
      BROKER_URL: amqp://credsort:${RABBITMQ_PASSWORD}@rabbitmq/credsort
      SERVICE_AUTH_MODE: ${SERVICE_AUTH_MODE:-keycloak}
      SERVICE_CLIENT_SECRET: ${SERVICE_CLIENT_SECRET}
      IDENTITY_URL: http://identity:8001
      ACCOUNTING_URL: http://accounting:8002
      INTELLIGENCE_URL: http://intelligence:8003
      MARKETPLACE_URL: http://marketplace:8004
      BILLING_URL: http://billing:8005
      ADVISORY_URL: http://advisory:8006
      NOTIFICATION_URL: http://notification:8007
      AUDIT_URL: http://audit:8008
    depends_on: {postgres: {condition: service_healthy}, rabbitmq: {condition: service_healthy}}

  accounting-worker:
    build: {context: ../.., dockerfile: deploy/compose/Dockerfile.service, args: {SERVICE: accounting}}
    command: ["python", "-m", "app.worker_main"]
    environment:
      CREDSORT_ENV: ${CREDSORT_ENV:-dev}
      DATABASE_URL: postgresql+psycopg://accounting_owner:${DB_PASSWORD_ACCOUNTING}@postgres/credsort_accounting
      DATABASE_ADMIN_URL: postgresql+psycopg://accounting_owner:${DB_PASSWORD_ACCOUNTING}@postgres/credsort_accounting
      BROKER_URL: amqp://credsort:${RABBITMQ_PASSWORD}@rabbitmq/credsort
      BEXIO_CLIENT_ID: ${BEXIO_CLIENT_ID}
      BEXIO_CLIENT_SECRET: ${BEXIO_CLIENT_SECRET}
    depends_on: {accounting: {condition: service_started}}

  intelligence:
    build: {context: ../.., dockerfile: deploy/compose/Dockerfile.service, args: {SERVICE: intelligence}}
    environment:
      PORT: "8003"
      CREDSORT_ENV: ${CREDSORT_ENV:-dev}
      DATABASE_URL: postgresql+psycopg://intelligence_owner:${DB_PASSWORD_INTELLIGENCE}@postgres/credsort_intelligence
      DATABASE_ADMIN_URL: postgresql+psycopg://intelligence_owner:${DB_PASSWORD_INTELLIGENCE}@postgres/credsort_intelligence
      BROKER_URL: amqp://credsort:${RABBITMQ_PASSWORD}@rabbitmq/credsort
      SERVICE_AUTH_MODE: ${SERVICE_AUTH_MODE:-keycloak}
      SERVICE_CLIENT_SECRET: ${SERVICE_CLIENT_SECRET}
      IDENTITY_URL: http://identity:8001
      ACCOUNTING_URL: http://accounting:8002
      INTELLIGENCE_URL: http://intelligence:8003
      MARKETPLACE_URL: http://marketplace:8004
      BILLING_URL: http://billing:8005
      ADVISORY_URL: http://advisory:8006
      NOTIFICATION_URL: http://notification:8007
      AUDIT_URL: http://audit:8008
    depends_on: {postgres: {condition: service_healthy}, rabbitmq: {condition: service_healthy}}

  marketplace:
    build: {context: ../.., dockerfile: deploy/compose/Dockerfile.service, args: {SERVICE: marketplace}}
    environment:
      PORT: "8004"
      CREDSORT_ENV: ${CREDSORT_ENV:-dev}
      DATABASE_URL: postgresql+psycopg://marketplace_owner:${DB_PASSWORD_MARKETPLACE}@postgres/credsort_marketplace
      DATABASE_ADMIN_URL: postgresql+psycopg://marketplace_owner:${DB_PASSWORD_MARKETPLACE}@postgres/credsort_marketplace
      BROKER_URL: amqp://credsort:${RABBITMQ_PASSWORD}@rabbitmq/credsort
      SERVICE_AUTH_MODE: ${SERVICE_AUTH_MODE:-keycloak}
      SERVICE_CLIENT_SECRET: ${SERVICE_CLIENT_SECRET}
      IDENTITY_URL: http://identity:8001
      ACCOUNTING_URL: http://accounting:8002
      INTELLIGENCE_URL: http://intelligence:8003
      MARKETPLACE_URL: http://marketplace:8004
      BILLING_URL: http://billing:8005
      ADVISORY_URL: http://advisory:8006
      NOTIFICATION_URL: http://notification:8007
      AUDIT_URL: http://audit:8008
    depends_on: {postgres: {condition: service_healthy}, rabbitmq: {condition: service_healthy}}

  billing:
    build: {context: ../.., dockerfile: deploy/compose/Dockerfile.service, args: {SERVICE: billing}}
    environment:
      PORT: "8005"
      CREDSORT_ENV: ${CREDSORT_ENV:-dev}
      DATABASE_URL: postgresql+psycopg://billing_owner:${DB_PASSWORD_BILLING}@postgres/credsort_billing
      DATABASE_ADMIN_URL: postgresql+psycopg://billing_owner:${DB_PASSWORD_BILLING}@postgres/credsort_billing
      BROKER_URL: amqp://credsort:${RABBITMQ_PASSWORD}@rabbitmq/credsort
      SERVICE_AUTH_MODE: ${SERVICE_AUTH_MODE:-keycloak}
      SERVICE_CLIENT_SECRET: ${SERVICE_CLIENT_SECRET}
      IDENTITY_URL: http://identity:8001
      ACCOUNTING_URL: http://accounting:8002
      INTELLIGENCE_URL: http://intelligence:8003
      MARKETPLACE_URL: http://marketplace:8004
      BILLING_URL: http://billing:8005
      ADVISORY_URL: http://advisory:8006
      NOTIFICATION_URL: http://notification:8007
      AUDIT_URL: http://audit:8008
    depends_on: {postgres: {condition: service_healthy}, rabbitmq: {condition: service_healthy}}

  advisory:
    build: {context: ../.., dockerfile: deploy/compose/Dockerfile.service, args: {SERVICE: advisory}}
    environment:
      PORT: "8006"
      CREDSORT_ENV: ${CREDSORT_ENV:-dev}
      DATABASE_URL: postgresql+psycopg://advisory_owner:${DB_PASSWORD_ADVISORY}@postgres/credsort_advisory
      DATABASE_ADMIN_URL: postgresql+psycopg://advisory_owner:${DB_PASSWORD_ADVISORY}@postgres/credsort_advisory
      BROKER_URL: amqp://credsort:${RABBITMQ_PASSWORD}@rabbitmq/credsort
      SERVICE_AUTH_MODE: ${SERVICE_AUTH_MODE:-keycloak}
      SERVICE_CLIENT_SECRET: ${SERVICE_CLIENT_SECRET}
      IDENTITY_URL: http://identity:8001
      ACCOUNTING_URL: http://accounting:8002
      INTELLIGENCE_URL: http://intelligence:8003
      MARKETPLACE_URL: http://marketplace:8004
      BILLING_URL: http://billing:8005
      ADVISORY_URL: http://advisory:8006
      NOTIFICATION_URL: http://notification:8007
      AUDIT_URL: http://audit:8008
    depends_on: {postgres: {condition: service_healthy}, rabbitmq: {condition: service_healthy}}

  notification:
    build: {context: ../.., dockerfile: deploy/compose/Dockerfile.service, args: {SERVICE: notification}}
    environment:
      PORT: "8007"
      CREDSORT_ENV: ${CREDSORT_ENV:-dev}
      DATABASE_URL: postgresql+psycopg://notification_owner:${DB_PASSWORD_NOTIFICATION}@postgres/credsort_notification
      DATABASE_ADMIN_URL: postgresql+psycopg://notification_owner:${DB_PASSWORD_NOTIFICATION}@postgres/credsort_notification
      BROKER_URL: amqp://credsort:${RABBITMQ_PASSWORD}@rabbitmq/credsort
      SERVICE_AUTH_MODE: ${SERVICE_AUTH_MODE:-keycloak}
      SERVICE_CLIENT_SECRET: ${SERVICE_CLIENT_SECRET}
      IDENTITY_URL: http://identity:8001
      ACCOUNTING_URL: http://accounting:8002
      INTELLIGENCE_URL: http://intelligence:8003
      MARKETPLACE_URL: http://marketplace:8004
      BILLING_URL: http://billing:8005
      ADVISORY_URL: http://advisory:8006
      NOTIFICATION_URL: http://notification:8007
      AUDIT_URL: http://audit:8008
    depends_on: {postgres: {condition: service_healthy}, rabbitmq: {condition: service_healthy}}

  audit:
    build: {context: ../.., dockerfile: deploy/compose/Dockerfile.service, args: {SERVICE: audit}}
    environment:
      PORT: "8008"
      CREDSORT_ENV: ${CREDSORT_ENV:-dev}
      DATABASE_URL: postgresql+psycopg://audit_owner:${DB_PASSWORD_AUDIT}@postgres/credsort_audit
      DATABASE_ADMIN_URL: postgresql+psycopg://audit_owner:${DB_PASSWORD_AUDIT}@postgres/credsort_audit
      BROKER_URL: amqp://credsort:${RABBITMQ_PASSWORD}@rabbitmq/credsort
      SERVICE_AUTH_MODE: ${SERVICE_AUTH_MODE:-keycloak}
      SERVICE_CLIENT_SECRET: ${SERVICE_CLIENT_SECRET}
      IDENTITY_URL: http://identity:8001
      ACCOUNTING_URL: http://accounting:8002
      INTELLIGENCE_URL: http://intelligence:8003
      MARKETPLACE_URL: http://marketplace:8004
      BILLING_URL: http://billing:8005
      ADVISORY_URL: http://advisory:8006
      NOTIFICATION_URL: http://notification:8007
      AUDIT_URL: http://audit:8008
    depends_on: {postgres: {condition: service_healthy}, rabbitmq: {condition: service_healthy}}

  web:
    build: {context: ../.., dockerfile: deploy/compose/Dockerfile.web}
    environment:
      SESSION_SECRET: ${SESSION_SECRET}
      AUTH_MODE: ${AUTH_MODE:-keycloak}
      IDENTITY_URL: http://identity:8001
      ACCOUNTING_URL: http://accounting:8002
      INTELLIGENCE_URL: http://intelligence:8003
      MARKETPLACE_URL: http://marketplace:8004
      BILLING_URL: http://billing:8005
      ADVISORY_URL: http://advisory:8006
      NOTIFICATION_URL: http://notification:8007
      AUDIT_URL: http://audit:8008
    ports: ["3000:3000"]

volumes:
  pgdata: {}
